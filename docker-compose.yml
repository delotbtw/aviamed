# Single project name: all containers/networks/volumes live under one compose project (incl. profile `test`).
name: med_center

services:
  nginx:
    image: nginx:1.27-alpine
    networks:
      default:
        ipv4_address: ${NGINX_IP:-172.28.0.10}  # fixed: the app trusts X-Forwarded-* only from this address (must be inside APP_SUBNET)
    ports:
      # IPv4 only on purpose: the compose network is IPv4-only, so IPv6 clients would arrive as the
      # gateway IP (172.28.0.1) and share one rate-limit bucket. To enable IPv6 later: enable_ipv6 +
      # IPv6 subnet in networks.default, `listen [::]:80` in nginx.conf, and publish "[::]:80:80".
      - "0.0.0.0:80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./app/static:/srv/static:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  # One-shot: applies Alembic migrations, then exits. App starts only after it succeeded.
  migrate:
    build: .
    env_file: .env
    environment: &app-env
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build: .
    env_file: .env
    environment:
      <<: *app-env
      # Trust X-Forwarded-* only from nginx (fixed address on the compose network below).
      FORWARDED_ALLOW_IPS: "${NGINX_IP:-172.28.0.10}"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  # Throwaway Postgres for pytest (tests/conftest.py default TEST_DATABASE_URL). Only started with `--profile test`.
  # Bound to 127.0.0.1 only; data on tmpfs (wiped on container removal); credentials are test-only, not from .env.
  postgres-test:
    profiles: ["test"]
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: medcenter
      POSTGRES_PASSWORD: medcenter
      POSTGRES_DB: medcenter_test
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medcenter -d medcenter_test"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    restart: unless-stopped

networks:
  default:
    ipam:
      config:
        - subnet: ${APP_SUBNET:-172.28.0.0/24}

volumes:
  pgdata:
