events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Rate limits (docs/08 section 5); values to be tuned by load tests.
    limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=pdf:10m rate=10r/m;
    limit_req_status 429;

    upstream app {
        server app:8000;
    }

    server {
        listen 80;  # TODO: TLS (listen 443 ssl) before the pilot

        limit_req zone=general burst=40 nodelay;

        # Behind a CDN/Cloudflare, uncomment and list the CDN ranges so $remote_addr is the real client
        # (affects both nginx limit_req and the XFF sent to the app). Never trust these from arbitrary hosts.
        # set_real_ip_from 203.0.113.0/24;   # CDN range(s), one line each
        # real_ip_header CF-Connecting-IP;   # or X-Forwarded-For with real_ip_recursive on;

        # WARNING: any proxy_set_header inside a location block resets inheritance of ALL proxy_set_header
        # from the server level. XFF would then not reach the app and every client would fall into one
        # shared rate-limit bucket. If a location needs its own header, repeat all four headers there.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite, never append: a client-supplied X-Forwarded-For must not reach the app (login rate limit by IP).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Static files. The base config has no mime.types, so each location includes it (otherwise CSS is text/plain).
        # css/js are versioned with ?v=<asset_version> in the templates: a short cache is enough and a change shows at once.
        location /static/ {
            alias /srv/static/;
            include /etc/nginx/mime.types;
            types { text/javascript js mjs; }  # RFC 9239; overrides application/javascript from mime.types
            expires 1h;
        }

        # Fonts never change under the same name.
        location /static/fonts/ {
            alias /srv/static/fonts/;
            include /etc/nginx/mime.types;
            types { text/javascript js mjs; }  # RFC 9239; overrides application/javascript from mime.types
            expires 30d;
        }

        location /auth/ {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://app;
        }

        location ~ ^/conclusions/\d+/pdf$ {
            limit_req zone=pdf burst=3 nodelay;
            proxy_pass http://app;
        }

        location / {
            proxy_pass http://app;
        }
    }
}
