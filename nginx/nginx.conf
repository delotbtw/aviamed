events {}

http {
    # Rate limits (docs/08 section 5); values to be tuned by load tests.
    limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=pdf:10m rate=10r/m;
    limit_req_status 429;

    upstream app {
        server app:8000;
    }

    server {
        listen 80;  # TODO: TLS (listen 443 ssl) before the pilot

        limit_req zone=general burst=40 nodelay;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location /static/ {
            alias /srv/static/;
            expires 7d;
        }

        location /auth/ {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://app;
        }

        location ~ ^/conclusions/\d+/pdf$ {
            limit_req zone=pdf burst=3 nodelay;
            proxy_pass http://app;
        }

        location / {
            proxy_pass http://app;
        }
    }
}
