[project]
name = "med-center"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    "email-validator>=2.3.0",
    "fastapi>=0.162.0",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "pydantic-settings>=2.16.1",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.32",
    "redis>=8.1.0",
    "sqladmin>=0.32.0",
    "sqlalchemy[asyncio]>=2.1.6",
    "uvicorn[standard]>=0.54.0",
    "weasyprint>=70.0",
]

[dependency-groups]
dev = [
    "fakeredis>=2.40.0",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# One event loop for the whole run: the app engine, Redis client and test engine share it.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI Depends() in defaults

[tool.ruff.lint.per-file-ignores]
"migrations/*" = ["E501", "I", "UP"]
